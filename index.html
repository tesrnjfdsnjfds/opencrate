<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111111"><meta name="description" content="Random independent music."><title>OpenCrate</title><link rel="stylesheet" href="style.css?v=3"><script defer src="catalog.js?v=2"></script><script defer src="app.js?v=3"></script></head>
<body><header><a class="brand" href="./">opencrate</a><button id="saved-toggle" class="quiet" aria-label="Show saved releases" title="Saved">♡ <span id="saved-count">0</span></button></header>
<main><section class="deck" aria-label="Release player"><div class="cover-wrap"><img id="cover" alt="" hidden><div id="cover-empty" aria-hidden="true">·</div></div><div class="release-info"><div class="title-row"><h1 id="title">Loading…</h1><button id="save" class="quiet" aria-label="Save release" title="Save release" disabled>♡</button></div><p id="artist"></p><div id="player"></div></div><div class="transport"><button id="previous" aria-label="Previous release" title="Previous release" disabled>←</button><button id="next" title="Next release (N)" disabled>Next <span aria-hidden="true">→</span></button><a id="bandcamp" target="_blank" rel="noopener noreferrer" aria-label="Open on Bandcamp" title="Open on Bandcamp" hidden>↗</a></div><p id="status" role="status" aria-live="polite"></p></section>
<details class="genres"><summary>Genres <span id="selection-count"></span></summary><div class="filter-head"><label class="search"><input id="search" type="search" placeholder="Search" aria-label="Search genres"></label><button id="reset" class="quiet">Reset</button></div><button id="all" class="tag all" aria-pressed="true">All</button><div id="tags" class="tags" aria-label="Genre filters"></div></details>
<section id="saved-panel" hidden><div class="filter-head"><h2>Saved</h2><button id="export" class="quiet" title="Export favorites">Export ↓</button></div><div id="saved-list"></div></section>
<details id="history"><summary>History <span id="history-count"></span></summary><div id="history-list"></div></details>
<div hidden><span id="sequence"></span><span id="release-tag"></span><span id="genre-count"></span><span id="filter-note"></span><span id="catalog-info"></span></div>
</main></body></html>
